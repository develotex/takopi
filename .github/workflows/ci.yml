name: CI

on:
  push:
    branches:
      - "master"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: format
            do_sync: true
            command: uv run --no-sync ruff format --check --diff src tests
            sync_args: --no-install-project
          - task: ruff
            do_sync: true
            command: uv run --no-sync ruff check src tests --output-format=github
            sync_args: --no-install-project
          - task: ty
            do_sync: true
            command: uv run --no-sync ty check src tests
            sync_args: --no-install-project
          - task: pytest
            do_sync: true
            command: uv run --no-sync pytest
            sync_args: ""
          - task: build
            do_sync: false
            command: uv build
            sync_args: ""
          - task: docs
            do_sync: true
            command: uv run --no-sync python scripts/docs_prebuild.py && uv run --no-sync zensical build --clean
            sync_args: --no-install-project --group docs

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        if: matrix.do_sync
        run: uv sync --frozen ${{ matrix.sync_args }}

      - name: Run check
        run: ${{ matrix.command }}

      - name: Add coverage to summary
        if: ${{ always() && matrix.task == 'pytest' }}
        run: |
          {
            echo "## Coverage"
            echo ""
            uv run --no-sync python -m coverage report || true
          } >> "$GITHUB_STEP_SUMMARY"

  pi-rpc-lifetime:
    name: pinned Pi RPC lifetime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - name: Install isolated pinned runtime packages
        run: npm install --prefix "$RUNNER_TEMP/pi-rpc-packages" --ignore-scripts @earendil-works/pi-coding-agent@0.99.2 pi-subagents@0.74.0
      - name: Prepare and verify compatibility copy
        run: |
          python3 scripts/prepare_pi_rpc_lifetime.py --source "$RUNNER_TEMP/pi-rpc-packages/node_modules/pi-subagents" --destination "$RUNNER_TEMP/pi-rpc-copy" --pi-package "$RUNNER_TEMP/pi-rpc-packages/node_modules/@earendil-works/pi-coding-agent"
          python3 scripts/prepare_pi_rpc_lifetime.py --verify --destination "$RUNNER_TEMP/pi-rpc-copy" --pi-package "$RUNNER_TEMP/pi-rpc-packages/node_modules/@earendil-works/pi-coding-agent"
      - name: Run all Pi example tests including real no-network lifecycle
        env:
          SUBAGENTS_ROOT: ${{ runner.temp }}/pi-rpc-copy
          PI_PACKAGE_ROOT: ${{ runner.temp }}/pi-rpc-packages/node_modules/@earendil-works/pi-coding-agent
          LIFETIME_SCRATCH_ROOT: ${{ runner.temp }}
        run: node --test examples/pi/*.test.mjs

  notify-commit:
    name: notify-commit
    runs-on: ubuntu-latest
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.checks.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Send Telegram notification
        run: uv run scripts/commit_notify.py
        env:
          REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
